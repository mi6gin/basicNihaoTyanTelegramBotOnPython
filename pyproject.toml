[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nihao-tyan-telegram-bot"
version = "1.0.0"
description = "Bilingual Telegram support bot"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "aiogram>=3.22,<4.0",
    "asyncpg>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy[asyncio]>=2.0.41,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nihao_tyan.i18n" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
